<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг котельной</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Схема отопления и ГВС</h1>
            <div id="status" class="status">Обновление...</div>
        </header>

        <div class="schema-container">
            <svg viewBox="0 0 960 610" class="schema-svg">
                <defs>
                    <linearGradient id="tankGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85"/>
                        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.85"/>
                    </linearGradient>
                    <linearGradient id="floorGrad" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#3b82f6"/>
                        <stop offset="100%" stop-color="#f59e0b"/>
                    </linearGradient>
                </defs>

                <!-- ТРУБЫ: ХВС и ГВС (единая толщина 6.5px) -->
                <path d="M 735 520 L 735 115 L 820 115" class="pipe cold"/>
                <path d="M 735 115 L 440 115 C 390 115, 390 205, 340 205 L 285 205" class="pipe cold"/>
                <path d="M 285 45 L 695 45 C 735 45, 735 90, 775 90 L 820 90" class="pipe hot"/>

                <!-- ТРУБЫ: Контур загрузки БКН -->
                <path d="M 525 290 L 40 290 L 40 75 L 240 75 C 265 75, 265 115, 240 115 L 200 115 C 175 115, 175 155, 200 155 L 240 155 C 265 155, 265 190, 240 190" class="pipe dark-hot"/>
                <path d="M 240 190 L 60 190 L 60 255" class="pipe cold"/>

                <!-- ТРУБЫ: Отопление (Подача) -->
                <path d="M 525 355 L 330 355" class="pipe hot"/>
                <path d="M 485 355 L 485 495 L 300 495" class="pipe warm-40"/>

                <!-- ТРУБЫ: Отопление (Обратка) -->
                <path d="M 130 495 L 60 495 L 60 255 L 525 255" class="pipe cold"/>
                <path d="M 135 355 L 60 355" class="pipe cold"/>

                <!-- АНИМАЦИЯ ДВИЖЕНИЯ ПОТОКОВ ПО ТРУБАМ -->
                <g class="flow-layer">
                    <!-- ХВС: снизу вверх в смеситель и подпитку БКН -->
                    <path d="M 735 520 L 735 115 L 820 115" class="flow-line flow-cold"/>
                    <path d="M 735 115 L 440 115 C 390 115, 390 205, 340 205 L 285 205" class="flow-line flow-cold"/>
                    <!-- ГВС: от бойлера в смеситель -->
                    <path d="M 285 45 L 695 45 C 735 45, 735 90, 775 90 L 820 90" class="flow-line flow-hot"/>
                    <!-- Загрузка БКН: от котла в змеевик -->
                    <path d="M 525 290 L 40 290 L 40 75 L 240 75" class="flow-line flow-hot"/>
                    <!-- Обратка змеевика БКН -->
                    <path d="M 240 190 L 60 190 L 60 255" class="flow-line flow-cold"/>
                    <!-- Подача отопления: от котла на батареи и через термостат на пол -->
                    <path d="M 525 355 L 330 355" class="flow-line flow-hot"/>
                    <path d="M 485 355 L 485 495 L 300 495" class="flow-line flow-warm"/>
                    <!-- Обратка отопления: от пола и батарей в котёл -->
                    <path d="M 130 495 L 60 495 L 60 255 L 525 255" class="flow-line flow-cold"/>
                    <path d="M 135 355 L 60 355" class="flow-line flow-cold"/>
                </g>

                <!-- ТЕРМОСТАТ 40° В ВИЛКЕ РАСПРЕДЕЛЕНИЯ -->
                <g class="thermostat-valve">
                    <rect x="474" y="346" width="22" height="18" rx="4" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
                    <rect x="482" y="338" width="6" height="8" fill="#64748b"/>
                    <rect x="473" y="321" width="24" height="17" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
                    <line x1="477" y1="326" x2="493" y2="326" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
                    <text x="485" y="315" class="thermostat-label">40°</text>
                </g>

                <!-- УЗЛЫ ОБОРУДОВАНИЯ -->
                <!-- 1. Бойлер косвенного нагрева -->
                <rect x="165" y="25" width="120" height="190" rx="12" fill="url(#tankGrad)" class="unit-box"/>
                <path d="M 165 75 L 240 75 C 265 75, 265 115, 240 115 L 200 115 C 175 115, 175 155, 200 155 L 240 155 C 265 155, 265 190, 240 190 L 165 190" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
                <text x="225" y="18" class="label">БКН (Бойлер)</text>

                <!-- 2. Газовый котёл -->
                <g>
                    <rect x="590" y="158" width="30" height="27" rx="3" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
                    <rect x="585" y="153" width="40" height="6" rx="2" fill="#94a3b8"/>
                    <rect x="525" y="185" width="160" height="230" rx="14" class="unit-box boiler-box"/>
                    <line x1="525" y1="352" x2="685" y2="352" stroke="#cbd5e1" stroke-width="2"/>
                    <rect x="563" y="225" width="84" height="82" rx="10" class="burner-window"/>
                    <path d="M 583 292 C 578 282, 587 270, 587 262 C 592 272, 598 282, 592 292 Z" class="flame"/>
                    <path d="M 605 292 C 599 279, 609 263, 609 252 C 615 266, 621 279, 614 292 Z" class="flame"/>
                    <path d="M 627 292 C 622 282, 631 270, 631 262 C 636 272, 642 282, 636 292 Z" class="flame"/>
                    <rect x="569" y="368" width="72" height="28" rx="6" fill="#0f172a"/>
                    <circle cx="583" cy="382" r="4" fill="#22c55e"/>
                    <rect x="594" y="378" width="36" height="8" rx="2" fill="#38bdf8" opacity="0.85"/>
                    <text x="605" y="143" class="label">Газовый котёл</text>
                </g>

                <!-- 3. Батареи -->
                <g>
                    <text x="232" y="328" class="label-red">батареи</text>
                    <rect x="135" y="348" width="195" height="12" rx="4" fill="#94a3b8"/>
                    <rect x="135" y="420" width="195" height="12" rx="4" fill="#94a3b8"/>
                    <g class="rad-sections">
                        <rect x="142" y="342" width="18" height="96" rx="4"/>
                        <rect x="165" y="342" width="18" height="96" rx="4"/>
                        <rect x="188" y="342" width="18" height="96" rx="4"/>
                        <rect x="211" y="342" width="18" height="96" rx="4"/>
                        <rect x="234" y="342" width="18" height="96" rx="4"/>
                        <rect x="257" y="342" width="18" height="96" rx="4"/>
                        <rect x="280" y="342" width="18" height="96" rx="4"/>
                        <rect x="303" y="342" width="18" height="96" rx="4"/>
                    </g>
                </g>

                <!-- 4. Тёплый пол -->
                <text x="220" y="485" class="label-red">пол</text>
                <path d="M 130 495 L 165 495 L 135 550 C 125 570, 175 585, 185 555 L 200 515 C 205 500, 230 500, 235 515 L 250 555 C 260 585, 310 570, 300 550 L 270 495 L 305 495" fill="none" stroke="url(#floorGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Анимация движения внутри змеевика тёплого пола (справа налево: от подачи к обратке) -->
                <path d="M 305 495 L 270 495 L 300 550 C 310 570, 260 585, 250 555 L 235 515 C 230 500, 205 500, 200 515 L 185 555 C 175 585, 125 570, 135 550 L 165 495 L 130 495" class="flow-line flow-warm"/>

                <!-- 5. Смеситель ГВС -->
                <g>
                    <rect x="817" y="80" width="24" height="44" rx="6" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
                    <line x1="829" y1="68" x2="829" y2="80" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
                    <rect x="815" y="62" width="28" height="6" rx="3" fill="#ef4444"/>
                    <path d="M 841 92 L 871 92 C 887 92, 895 102, 895 116 L 895 124" fill="none" stroke="#f8fafc" stroke-width="7.5" stroke-linecap="round"/>
                    <rect x="888" y="123" width="14" height="5" rx="2" fill="#64748b"/>
                    <path d="M 895 135 C 895 135, 886 147, 886 153 C 886 158, 890 162, 895 162 C 900 162, 904 158, 904 153 C 904 147, 895 135, 895 135 Z" class="droplet"/>
                </g>

                <!-- ДАТЧИКИ ТЕМПЕРАТУРЫ (5 шт.) -->
                <g class="sensor-badge" data-key="boiler_coil_in" transform="translate(72, 58)">
                    <rect width="76" height="32" rx="6"/>
                    <text x="38" y="21" id="val-boiler_coil_in">--.- °C</text>
                </g>

                <g class="sensor-badge" data-key="dhw_out" transform="translate(320, 29)">
                    <rect width="76" height="32" rx="6"/>
                    <text x="38" y="21" id="val-dhw_out">--.- °C</text>
                </g>

                <g class="sensor-badge" data-key="heating_return" transform="translate(72, 239)">
                    <rect width="76" height="32" rx="6"/>
                    <text x="38" y="21" id="val-heating_return">--.- °C</text>
                </g>

                <g class="sensor-badge" data-key="heating_supply" transform="translate(364, 339)">
                    <rect width="76" height="32" rx="6"/>
                    <text x="38" y="21" id="val-heating_supply">--.- °C</text>
                </g>

                <g class="sensor-badge" data-key="floor_return" transform="translate(68, 479)">
                    <rect width="76" height="32" rx="6"/>
                    <text x="38" y="21" id="val-floor_return">--.- °C</text>
                </g>
            </svg>
        </div>

        <div class="cards" id="cards-panel">
            <div class="card"><span>Подача в БКН</span><strong id="card-boiler_coil_in">--.- °C</strong></div>
            <div class="card"><span>ГВС выход</span><strong id="card-dhw_out">--.- °C</strong></div>
            <div class="card"><span>Подача отопления</span><strong id="card-heating_supply">--.- °C</strong></div>
            <div class="card"><span>Обратка котла</span><strong id="card-heating_return">--.- °C</strong></div>
            <div class="card"><span>Обратка тёплого пола</span><strong id="card-floor_return">--.- °C</strong></div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
